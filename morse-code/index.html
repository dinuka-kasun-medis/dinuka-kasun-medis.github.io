<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morse Code — Dinuka Kasun Medis</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/terminal.css" />
</head>
<body>
<div class="shell">

  <!-- ══════════════════ HEADER ══════════════════ -->
  <div class="window">
    <div class="titlebar">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
      <span class="tab-title"><span>dinuka</span>@portfolio: ~/morse-code</span>
    </div>
    <div class="body">
      <div class="prompt">
        <span class="p-user">dinuka</span><span class="p-at">@</span><span class="p-host">portfolio</span><span class="p-colon">:</span><span class="p-path">~/morse-code</span><span class="p-sign">$</span>
        <span class="p-cmd">./morse-code</span>
        <span class="p-arg">--run</span>
      </div>
      <div class="output">
        <!-- ↓↓↓ Your morse-code project content goes here ↓↓↓ -->
        <p style="color: var(--grey-lt); font-size: 13px;">
          Morse Code project loaded.<br>
          Replace this content with your actual morse-code app.
        </p>
        <!-- ↑↑↑ Your morse-code project content goes here ↑↑↑ -->
      </div>
    </div>
  </div>

  <!-- Back link -->
  <div style="text-align:center; padding: 10px 0 40px;">
    <a href="../" style="color: var(--grey-lt); font-size: 12px; text-decoration: none; font-family: var(--font-mono);">
      ← cd ../ &nbsp; back to portfolio
    </a>
  </div>

</div>
<script src="../assets/js/main.js"></script>
</body>
</html>
